<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tab Audio Recorder – Settings</title>
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <main class="card">
      <header class="top">
        <img src="icons/icon48.png" alt="" width="36" height="36" />
        <div>
          <h1>Tab Audio Recorder</h1>
          <p class="sub">Click the toolbar icon on any tab to start recording. A small bar appears on the page with pause, stop and hide.</p>
        </div>
      </header>

      <section class="group">
        <div class="field">
          <span class="label">Format</span>
          <div class="seg" id="formatSeg" role="radiogroup" aria-label="Format">
            <button type="button" role="radio" data-format="mp3">MP3</button>
            <button type="button" role="radio" data-format="wav">WAV</button>
            <button type="button" role="radio" data-format="webm">WebM</button>
          </div>
        </div>

        <div class="field">
          <label class="label" for="bitrate">Quality</label>
          <select id="bitrate">
            <option value="128">128 kbps · smaller files</option>
            <option value="192">192 kbps · balanced</option>
            <option value="256">256 kbps · high</option>
            <option value="320">320 kbps · best</option>
          </select>
        </div>
        <p class="hint" id="formatHint"></p>
      </section>

      <section class="group">
        <label class="toggle">
          <input type="checkbox" id="monitor" />
          <span class="switch" aria-hidden="true"></span>
          <span>Keep playing audio while recording</span>
        </label>
        <label class="toggle">
          <input type="checkbox" id="saveAs" />
          <span class="switch" aria-hidden="true"></span>
          <span>Ask where to save each file</span>
        </label>
      </section>

      <section class="group rows">
        <div class="row">
          <span class="label">Keyboard shortcut</span>
          <span><span id="shortcut">Not set</span> <button id="editShortcut" class="linkbtn" type="button">Change</button></span>
        </div>
        <div class="row">
          <span class="label">Saved to</span>
          <span>Downloads/Tab Recordings</span>
        </div>
      </section>

      <p class="saved" id="savedNote" aria-live="polite"></p>
    </main>
    <script src="options.js"></script>
  </body>
</html>
